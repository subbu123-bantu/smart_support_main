<!DOCTYPE html>
<html lang="en">
<head>
  <title>{% block title %}Smart Support Notification{% endblock %}</title>
  <meta charset="UTF-8" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 600px;
      margin: 40px auto;
      background-color: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .header {
      background-color: #4f46e5;
      color: white;
      padding: 24px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 22px;
    }

    .body {
      padding: 32px;
      color: #333;
    }

    .body p {
      font-size: 15px;
      line-height: 1.6;
    }

    .ticket-box {
      background-color: #f8f8ff;
      border-left: 4px solid #4f46e5;
      padding: 16px;
      border-radius: 4px;
      margin: 20px 0;
    }

    .comment-box {
      background-color: #f1f5f9;
      border-radius: 6px;
      padding: 14px;
      font-style: italic;
      color: #111827;
      margin-top: 10px;
    }

    .badge,
    .status-badge,
    .user-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 14px;
      margin: 4px 0;
    }

    .user-badge {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      margin-left: 8px;
    }

    .open { background-color: #fee2e2; color: #991b1b; }
    .in_progress { background-color: #fef9c3; color: #92400e; }
    .closed { background-color: #dcfce7; color: #166534; }

    .billing { background-color: #dbeafe; color: #1d4ed8; }
    .technical { background-color: #fce7f3; color: #be185d; }
    .authentication { background-color: #ede9fe; color: #6d28d9; }
    .network { background-color: #d1fae5; color: #065f46; }
    .account { background-color: #ffedd5; color: #9a3412; }
    .other { background-color: #f3f4f6; color: #374151; }

    .low { background-color: #dcfce7; color: #166534; }
    .medium { background-color: #fef9c3; color: #92400e; }
    .high { background-color: #fee2e2; color: #991b1b; }
    .urgent { background-color: #f3e8ff; color: #581c87; }

    .admin { background-color: #fee2e2; color: #950808; }
    .agent { background-color: #fef3c7; color: #874f0e; }

    .button {
      display: inline-block;
      background: #4f46e5;
      color: white !important;
      padding: 10px 16px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }

    .footer {
      text-align: center;
      padding: 16px;
      font-size: 12px;
      color: #444;
      background-color: #f4f4f4;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>{% block header %}Smart Support Notification{% endblock %}</h1>
    </div>

    <div class="body">
      {% block content %}{% endblock %}
    </div>

    <div class="footer">
      This is an automated message. Please do not reply directly to this email.
    </div>
  </div>
</body>
</html>
